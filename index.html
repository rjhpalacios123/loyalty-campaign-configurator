<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyalty Campaign Configurator</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#242424;font:16px system-ui,sans-serif}header{background:#b91026;color:white;padding:28px max(24px,calc((100% - 850px)/2))}header h1{margin:0;font-size:28px}header p{margin:8px 0 0}main{max-width:850px;margin:24px auto;padding:0 16px}.panel,section{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}button,select{font:inherit;padding:12px;border:1px solid #aaa;border-radius:8px;background:white;color:#222}button{cursor:pointer}button.primary{background:#b91026;color:white;border-color:#b91026}button:focus-visible,select:focus-visible{outline:3px solid #2864bc;outline-offset:3px}progress{width:100%;accent-color:#b91026;height:12px}label{display:block;font-weight:650;margin-bottom:12px}select{width:100%}small{color:#666}h2{font-size:20px;margin:0 0 16px}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{color:#666}dd{margin:0;font-weight:600;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{color:#666;font-size:13px;padding:12px 0}@media(max-width:480px){header h1{font-size:23px}.panel,section{padding:16px}}.channels{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font-size:clamp(11px,2.5vw,15px)}.channels th,.channels td{padding:12px 3px;border:1px solid #ddd;overflow-wrap:anywhere}.channels th{background:#f5f5f5}.mandatory{color:#17653b;background:#e9f5ed;font-weight:600}.optional{color:#555;background:#f4f4f4;font-weight:600}.conditional{background:#fff4dd;color:#916000;font-weight:600}.channel-icon{display:block;width:32px;height:32px;margin:0 auto 9px;color:#444}.channels th{vertical-align:top}.scope-banner{background:#b91026;color:white;text-align:center;padding:36px 20px;border-radius:12px;margin-bottom:16px}.scope-banner h2{font-size:32px;margin:12px 0}.scope-banner p{margin:8px 0}.scope-banner svg{width:48px;height:48px}.info-banner{background:#0755b5;color:white;text-align:center;padding:36px 20px;border-radius:12px;margin-bottom:16px}.info-banner h2{font-size:30px;margin:12px 0}.info-banner p{margin:8px 0}.info-banner svg{width:44px;height:44px}.step-label{display:flex;align-items:center;gap:12px}.step-marker{display:inline-flex;flex:0 0 32px;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;background:#fce8eb;color:#b91026;font-weight:650}.step-marker.complete{background:#e9f5ed;color:#17653b}.step-marker svg{width:20px;height:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}.scope-banner.wip{background:#fff0cc;color:#946200;border:1px solid #e5b34c}</style></head><body><header><h1>Loyalty Campaign Configurator</h1><p>Customer Growth &amp; Loyalty · Campaign builder</p></header><main><div class="panel"><div class="top"><strong id="progressText" aria-live="polite"></strong><button id="reset">Reset configuration</button></div><progress id="progress" max="1" value="0"></progress><p><small>Complete each selection to unlock the next step.</small></p></div><div id="steps"></div><div id="scopeBanner" class="scope-banner" role="alert" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/></svg><h2 id="scopeTitle">OUT OF SCOPE</h2><p id="scopeMessage"></p><p>Please select another campaign to continue.</p></div><div id="infoBanners" aria-live="polite"></div><div id="delivery" hidden></div><footer>Prototype · No customer data required. Selections are not stored or transmitted by this application.</footer></main><script src="campaign-rules.js"></script><script>
const channelIcons={"Member Hub": "<rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"/><path d=\"M10 18h4\"/>", "Push": "<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4\"/>", "Email": "<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/><path d=\"m2 6 10 7L22 6\"/>", "Online Checkout": "<path d=\"M2 3h3l3 13h12l2-10H6\"/><circle cx=\"9\" cy=\"21\" r=\"1\"/><circle cx=\"19\" cy=\"21\" r=\"1\"/>", "eCommerce Pages": "<rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M12 17v4M7 21h10\"/>", "POS Checkout": "<path d=\"M3 9h18l-2-6H5L3 9ZM4 9v12h16V9M9 21v-7h6v7\"/>"};
function channelIcon(name){const span=document.createElement("span");span.innerHTML=`<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${channelIcons[name]||'<rect x="3" y="3" width="18" height="18" rx="3"/>'}</svg>`;return span;}
let values = Object.create(null);
function rules(){return {...defaultRules,...(campaignRules[values.campaign]||{})}}
function getSteps(){const r=rules();return [{id:'campaign',label:campaignLabel,options:Object.keys(campaignRules)},...(r.steps||defaultSteps).map(step=>({...step,...(r.stepOverrides?.[step.id]||{})})).filter(step=>!step.disabled)]}
function options(step){return (step.conditionalOptions||[]).find(rule=>Object.entries(rule.when).every(([id,value])=>values[id]===value))?.options||step.options}
function render(focusId){const outOfScope=rules().outOfScope===true;const wip=!outOfScope&&rules().workInProgress===true;const blocked=outOfScope||wip;const steps=getSteps();const root=document.getElementById('steps');root.replaceChildren();let unlocked=true,count=0;
for(const [i,step] of steps.entries()){if(!unlocked||(blocked&&i>0)){delete values[step.id];continue}const opts=options(step);if(!opts.includes(values[step.id]))delete values[step.id];const section=document.createElement('section');const label=document.createElement('label');label.htmlFor='field-'+step.id;const complete=Boolean(values[step.id])&&!blocked;label.className='step-label';const marker=document.createElement('span');marker.className='step-marker'+(complete?' complete':'');marker.setAttribute('aria-hidden','true');if(complete){marker.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>'}else{marker.textContent=String(i+1)}label.append(marker,document.createTextNode(step.label));if(complete){const sr=document.createElement('span');sr.className='sr-only';sr.textContent=' (completed)';label.append(sr)}const select=document.createElement('select');select.id=label.htmlFor;select.add(new Option('Select an option',''));opts.forEach(o=>select.add(new Option(o,o)));select.value=values[step.id]||'';select.addEventListener('change',()=>{const chosen=select.value;for(const later of steps.slice(i+1))delete values[later.id];if(i===0)values=Object.create(null);values[step.id]=chosen;render(step.id)});section.append(label,select);root.append(section);unlocked=Boolean(values[step.id]);if(unlocked)count++}
const scopeBanner=document.getElementById('scopeBanner');scopeBanner.hidden=!blocked;scopeBanner.classList.toggle('wip',wip);document.getElementById('scopeTitle').textContent=wip?'WORK IN PROGRESS':'OUT OF SCOPE';document.getElementById('scopeMessage').textContent=(values.campaign||'')+(wip?' campaign is currently under development.':' campaign is currently out of scope.');const progress=document.getElementById('progress');const started=Boolean(values.campaign);progress.max=started&&!blocked?steps.length:1;progress.value=started&&!blocked?count:0;document.getElementById('progressText').textContent=!started?'Select a campaign to get started':blocked?'Configuration unavailable':`${count} of ${steps.length} steps completed`;if(focusId)document.getElementById('field-'+focusId)?.focus();const banners=document.getElementById('infoBanners');banners.replaceChildren();let hideDelivery=false;if(!blocked){for(const banner of rules().banners||[]){if(!Object.entries(banner.when).every(([id,value])=>values[id]===value))continue;if(banner.hideDelivery===true)hideDelivery=true;const box=document.createElement('div');box.className='info-banner';box.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg>';const heading=document.createElement('h2');heading.textContent=banner.title;const message=document.createElement('p');message.textContent=banner.message;box.append(heading,message);banners.append(box)}}const delivery=document.getElementById('delivery');delivery.hidden=blocked||hideDelivery||count!==steps.length;delivery.replaceChildren();if(!delivery.hidden){const r=rules();for(const [title,channels] of [['Delivery Channels (Online)',r.online],['Delivery Channels (Instore)',r.instore],['Delivery Channels (Comms)',r.comms]]){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;const table=document.createElement('table');table.className='channels';if(channels.length===1)table.style.maxWidth='180px';const head=table.createTHead().insertRow();const row=table.createTBody().insertRow();channels.forEach(([name,status])=>{const th=document.createElement('th');th.scope='col';th.append(channelIcon(name),document.createTextNode(name));head.append(th);const td=row.insertCell();td.textContent=status;td.className=(status==='Conditional'||status==='Consent-required')?'conditional':status==='Optional'?'optional':'mandatory'});section.append(h,table);delivery.append(section)}}}
document.getElementById('reset').onclick=()=>{values=Object.create(null);render('campaign')};render();
</script></body></html>
