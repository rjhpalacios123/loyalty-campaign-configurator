<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loyalty Campaign Configurator</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#242424;font:16px system-ui,sans-serif}header{background:#b91026;color:white;padding:28px max(24px,calc((100% - 850px)/2))}header h1{margin:0;font-size:28px}header p{margin:8px 0 0}main{max-width:850px;margin:24px auto;padding:0 16px}.panel,section{background:white;border:1px solid #ddd;border-radius:12px;padding:22px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}button,select{font:inherit;padding:12px;border:1px solid #aaa;border-radius:8px;background:white;color:#222}button{cursor:pointer}button.primary{background:#b91026;color:white;border-color:#b91026}button:focus-visible,select:focus-visible{outline:3px solid #2864bc;outline-offset:3px}progress{width:100%;accent-color:#b91026;height:12px}label{display:block;font-weight:650;margin-bottom:12px}select{width:100%}small{color:#666}h2{font-size:20px;margin:0 0 16px}dl{display:grid;grid-template-columns:1fr 1fr;gap:12px}dt{color:#666}dd{margin:0;font-weight:600;overflow-wrap:anywhere}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{color:#666;font-size:13px;padding:12px 0}@media(max-width:480px){header h1{font-size:23px}.panel,section{padding:16px}}.channels{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font-size:clamp(11px,2.5vw,15px)}.channels th,.channels td{padding:12px 3px;border:1px solid #ddd;overflow-wrap:anywhere}.channels th{background:#f5f5f5}.mandatory{color:#17653b;background:#e9f5ed;font-weight:600}.optional{color:#555;background:#f4f4f4;font-weight:600}.conditional{background:#fff4dd;color:#916000;font-weight:600}.channel-icon{display:block;width:32px;height:32px;margin:0 auto 9px;color:#444}.channels th{vertical-align:top}</style></head><body><header><h1>Loyalty Campaign Configurator</h1><p>Customer Growth &amp; Loyalty · Campaign builder</p></header><main><div class="panel"><div class="top"><strong id="progressText" aria-live="polite"></strong><button id="reset">Reset configuration</button></div><progress id="progress" max="6" value="0"></progress><p><small>Complete each selection to unlock the next step.</small></p></div><div id="steps"></div><div id="delivery" hidden></div><footer>Prototype · No customer data required. Selections are not stored or transmitted by this application.</footer></main><script src="campaign-rules.js"></script><script>
const channelIcons={"Member Hub": "<rect x=\"6\" y=\"2\" width=\"12\" height=\"20\" rx=\"2\"/><path d=\"M10 18h4\"/>", "Push": "<path d=\"M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4\"/>", "Email": "<rect x=\"2\" y=\"4\" width=\"20\" height=\"16\" rx=\"2\"/><path d=\"m2 6 10 7L22 6\"/>", "Online Checkout": "<path d=\"M2 3h3l3 13h12l2-10H6\"/><circle cx=\"9\" cy=\"21\" r=\"1\"/><circle cx=\"19\" cy=\"21\" r=\"1\"/>", "eCommerce Pages": "<rect x=\"2\" y=\"3\" width=\"20\" height=\"14\" rx=\"2\"/><path d=\"M12 17v4M7 21h10\"/>", "POS Checkout": "<path d=\"M3 9h18l-2-6H5L3 9ZM4 9v12h16V9M9 21v-7h6v7\"/>"};
function channelIcon(name){const span=document.createElement("span");span.innerHTML=`<svg class="channel-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${channelIcons[name]||'<rect x="3" y="3" width="18" height="18" rx="3"/>'}</svg>`;return span;}
const labels=['Choose a Campaign','Campaign Cadence','Campaign Type','Spend Requirements','Reward Timing','Reward Type'];
const values=labels.map(()=> '');const controls=[];
function rules(){return {...defaultRules,...(campaignRules[values[0]]||{})}}
function options(i){const r=rules();return [Object.keys(campaignRules),r.cadence,r.types,r.spendRequirements,r.timing,r.rewardTypesByTiming?.[values[4]]||r.rewardTypes][i]}
labels.forEach((label,i)=>{const section=document.createElement('section');const l=document.createElement('label');l.htmlFor='field'+i;l.textContent=`${i+1}. ${label}`;const select=document.createElement('select');select.id=l.htmlFor;select.addEventListener('change',()=>{values[i]=select.value;values.fill('',i+1);render()});section.append(l,select);document.getElementById('steps').append(section);controls.push({section,select})});
function render(){controls.forEach(({section,select},i)=>{section.hidden=!values.slice(0,i).every(Boolean);select.replaceChildren(new Option('Select an option',''));options(i).forEach(o=>select.add(new Option(o,o)));select.value=values[i]});const count=values.filter(Boolean).length;document.getElementById('progress').value=count;document.getElementById('progressText').textContent=`${count} of ${labels.length} steps completed`;const delivery=document.getElementById('delivery');delivery.hidden=count!==labels.length;delivery.replaceChildren();if(!delivery.hidden){const r=rules();for(const [title,channels] of [['Delivery Channels (Online)',r.online],['Delivery Channels (Instore)',r.instore]]){const section=document.createElement('section');const h=document.createElement('h2');h.textContent=title;const table=document.createElement('table');table.className='channels';if(channels.length===1)table.style.maxWidth='180px';const head=table.createTHead().insertRow();const row=table.createTBody().insertRow();channels.forEach(([name,status])=>{const th=document.createElement('th');th.scope='col';th.append(channelIcon(name),document.createTextNode(name));head.append(th);const td=row.insertCell();td.textContent=status;td.className=status==='Conditional'?'conditional':status==='Optional'?'optional':'mandatory'});section.append(h,table);delivery.append(section)}}}
document.getElementById('reset').onclick=()=>{values.fill('');render();controls[0].select.focus()};render();
</script></body></html>
